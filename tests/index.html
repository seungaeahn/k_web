<div id="test-results" hidden></div>
<script>
  // 실수로 ?demo=test 없이 열면 실제 기록을 건드릴 수 있으니, 아래 스크립트를 읽지 않고 ?demo=test 로 다시 엶
  if (new URLSearchParams(location.search).get('demo') !== 'test') {
    location.replace(`${location.pathname}?demo=test${location.hash}`);
    document.write('<plaintext hidden>');
  }
</script>
